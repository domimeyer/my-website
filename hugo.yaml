  homeInfoParams:
    Title: "Dominique M.-A. Meyer"
    Content: >
      Astrophysicist · Cultural history of the sky.  
      
      I study the birth, life and death of stars through numerical simulations,
      and I write on the scientific and cultural memory of the sky.

